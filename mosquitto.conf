# Mosquitto config for the battery twin
#
# CHANGED: added a WebSockets listener on 9001.
# Browsers cannot open raw TCP sockets, so Unity WebGL (and any
# browser-based dashboard) must reach MQTT over WebSockets.
# The ESP32s keep using plain TCP on 1883.

# --- ESP32s and Python clients ---
listener 1883 0.0.0.0
protocol mqtt

# --- Browsers: Unity WebGL, JS dashboards ---
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

max_queued_messages 1000
